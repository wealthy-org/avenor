[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"

# --- Pinned compiler settings -------------------------------------------------
# Do not let forge resolve a different solc: the strategy bytecode we ship has to
# be reproducible from this file alone. `docs/BASELINE.md` records the same pins.
solc = "0.8.18"
# Refuse to silently switch compilers when a pragma would allow it.
auto_detect_solc = false
# `paris` (not shanghai/cancun): matches the EVM target used for the verified
# Vyper core (`vyper --evm-version paris`) and avoids opcodes that may be absent
# on chain 4663 (PUSH0 was the concrete reason for upstream's paris pin).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
# Explicit, not implicit: metadata is appended to deployed bytecode, so this
# choice changes the bytecode hash. Upstream builds use the forge default (ipfs).
bytecode_hash = "ipfs"
cbor_metadata = true

# Tests/scripts read the pinned artifacts (ABI + bytecode hashes) and the chain
# config. Nothing outside these paths is accessible to Solidity.
fs_permissions = [
    { access = "read", path = "../core/artifacts" },
    { access = "read", path = "../config" },
    { access = "read-write", path = "./deployments" },
]

# Remappings live in exactly one place: remappings.txt. Keeping a duplicate array
# here invites the two drifting apart, which shows up as "compiles on my machine".

[rpc_endpoints]
# Both still serve the pinned block (118337511); the drpc/publicnode/thirdweb trio below does not.
robinhood_solidrpc = "https://rpc.solidrpc.io/public/evm/4663"
robinhood_onfinality = "https://robinhood.api.onfinality.io/public"
robinhood = "https://robinhood-rpc.publicnode.com"
robinhood_drpc = "https://robinhood.drpc.org"
robinhood_thirdweb = "https://4663.rpc.thirdweb.com"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
multiline_func_header = "params_first"

[fuzz]
runs = 1024
max_test_rejects = 65536

[invariant]
runs = 64
depth = 32
fail_on_revert = false

# No etherscan entry on purpose: the only explorer for chain 4663
# (robinhoodchain.blockscout.com) is behind Cloudflare from this host, so source
# verification is a documented blocker, not a silent fallback (docs/BASELINE.md §5).
[etherscan]