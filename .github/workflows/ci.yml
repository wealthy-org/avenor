name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify All Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: avenor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.9.0"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # verify-all.py runs `forge build --offline` / `forge test --offline` on purpose (deterministic,
      # no network dependency mid-gate). Foundry downloads solc on first online build, so warm the
      # ~/.svm cache here and reuse it across runs instead of failing with
      # "can't install missing solc 0.8.18 in offline mode".
      - name: Restore solc cache
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-solc-${{ runner.os }}-0.8.18

      - name: Warm solc cache (download if missing)
        run: forge build
        working-directory: packages/contracts

      - name: Install dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix services/indexer
          npm ci --prefix services/keeper
          npm ci --prefix packages/sdk

      # scripts/db-test.py spins up its own throwaway postgres cluster and looks for
      # initdb/pg_ctl either on PATH or via PG_BIN. Runner images ship the server binaries
      # under /usr/lib/postgresql/<major>/bin but do not put them on PATH.
      - name: Locate PostgreSQL binaries
        run: echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Verify All Gates
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/avenor_test
        run: |
          python scripts/verify-all.py --no-bytecode --with-web-build
