note = "Dua run `python scripts/fork-test.py` berurutan 6/6 PASS (71,76s dan 94,45s) melawan state pin 118337511 via archive keyless. Tiga bug invocation ditemukan dan didokumentasikan, bukan di-workaround: (1) default hardfork `london` -> bytecode venue PUSH0 halt `EvmError: NotActivated`, perlu `--hardfork cancun` (JANGAN ubah evm_version di foundry.toml, itu merusak bukti bytecode); (2) chain 4663 Arbitrum Orbit, `block.number` = tinggi L1 (26450152), tinggi L2 = ArbSys(0x64).arbBlockNumber() = 118337511 -> pin diverifikasi lewat `arbBlockNumber()`; (3) forge 1.9 butuh `eth_getAccountInfo` dan mengirim parameter EIP-1898 berbentuk object yang ditolak drpc/solidrpc -> `--fork-state-by-number` + anvil lokal `--fork-url http://127.0.0.1:<port>`. Probe venue menemukan bug adapter nyata (`venue.maxWithdraw` = 0 walau kas idle 27M) yang sudah diperbaiki di `MorphoVaultStrategy._venueLiquidity()` + diuji unit dan fork. Endpoint: rpc.solidrpc.io/public/evm/4663 (utama), robinhood.api.onfinality.io/public (cadangan); drpc sudah prune pin ini."

