[[entry]]
id = 5
type = "story"
title = "Verify USDG and venue addresses on chain 4663 via RPC"
description = "Baca simbol/decimals/totalSupply USDG, alamat venue steakUSDG beserta asset()/totalAssets()/maxWithdraw() dari RPC langsung; catat block number + hash."
verify = "Tabel verifikasi di docs/REFERENCE_CAPTURE.md §3/§4 terisi nilai nyata + block; tidak ada alamat yang dipakai tanpa pembacaan on-chain."
covers = ["S0"]
after = [1]
hitl = false
risk = "medium"
status = "done"
completed = "2026-11-20"
note = """
Dibaca ulang langsung dari RPC pada pin yang sama (`eth_call` @118337511 via
`rpc.solidrpc.io/public/evm/4663`), bukan dari API:

- header: `eth_getBlockByNumber(0x70dafe7)` -> number 118337511, hash
  `0xbaa980abd65e0c748b3b5f69d2352b69dd33b03138179bf61c988137291ba0af`, timestamp 1795103654
  (2026-11-19T15:54:14Z) — cocok byte-per-byte dengan `packages/config/4663.json`.
- `ArbSys(0x64).arbBlockNumber()` = 118337511 (chain 4663 = Arbitrum Orbit; L2 height, bukan
  `block.number` yang berisi tinggi L1).
- USDG `0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168`: `symbol()="USDG"`, `decimals()=6`,
  `totalSupply()=622410599910270`.
- steakUSDG `0xBeEff033F34C046626B8D0A041844C5d1A5409dd`: `symbol()="steakUSDG"`,
  `decimals()=18`, `asset()=USDG`, `totalAssets()=538856055994280`,
  `totalSupply()=531418644510854399888342585`,
  `USDG.balanceOf(venue)=27024457979514` (kas idle 27.024,457979 USDG = 5,02% dari TVL).

Semua angka sama dengan `packages/config/4663.json`; tidak ada yang berubah, jadi tidak ada
angka dokumen yang perlu dikoreksi. Yang tetap **belum** terbukti dan tidak diklaim:
identitas issuer USDG (`issuer_verified: false` — `docs.robinhood.com` tak terbaca dari host)
dan hash bytecode venue terhadap rilis Morpho Vault V2."""