note = """
`docs/COMPATIBILITY_MATRIX.md` — satu baris per modul dengan pin, permukaan ABI, bukti test,
vonis. Hasil: `VaultV3`/`VaultFactory`/`TokenizedStrategy`/`Accountant`/`IVault.sol` =
kompatibel-teruji; `RoleManager`/`TimelockExecutor`/`DebtAllocator` = **tidak dipakai** (ADR-4
memakai OZ `TimelockController` langsung, ADR-6 mematikan auto-allocate) sehingga tidak diuji dan
tidak diklaim; `Yearn-ERC4626-Router@fc96fe36` = ditolak lewat ADR-11 baru di
`docs/ARCHITECTURE.md`.

Alasan penolakan Router bukan preferensi: sembilan panggilan yang dipakai app sudah ada di ABI
vault, dan Router akan menyembunyikan `max_loss` di balik helper padahal aturan produk 2 menuntut
`max_loss` eksplisit tiap panggilan. Menolak lebih murah daripada mem-vendor + menulis test untuk
kontrak AGPL yang tidak menambah kemampuan.

Tidak ada file Vyper/solidity yang berubah untuk ticket ini (nol perubahan `packages/core`).
Dokumen yang diperbarui: `COMPATIBILITY_MATRIX.md` (baru), `ARCHITECTURE.md` (ADR-11),
`BASELINE.md` (§1, §2 butir 2, §6), `REPRODUCIBILITY.md` §8.2, `SECURITY_DIFF.md` §4."""

