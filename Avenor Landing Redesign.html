rtant}\n h2{font-size:38px !important}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"av\" style=\"--ac:{{accent}};--play:{{playState}};width:100%;color:#e9efeb;background:#0a0f0d;font-family:'Sora',system-ui,sans-serif\">\n<div class=\"vig\"><\u002Fdiv><div class=\"gridbg\"><\u002Fdiv>\n\n<!-- NAV -->\n<header style=\"position:sticky;top:0;z-index:30;padding:14px 0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(10,15,13,.78);border-bottom:1px solid var(--line)\">\n<div class=\"wrap\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n<a href=\"#top\" style=\"display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.22em;font-size:15px\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" aria-hidden=\"true\"><path d=\"M16 3 4 29h6l2.2-5.2h7.6L22 29h6L16 3Zm0 9.5 2.7 6.3h-5.4L16 12.5Z\" fill=\"#52b896\"><\u002Fpath><\u002Fsvg>\nAVENOR<\u002Fa>\n<nav class=\"nv\" aria-label=\"Primary\" style=\"display:flex;gap:2px\">\n<a href=\"#vaults\">Vaults<\u002Fa><a href=\"#how\">How it works<\u002Fa><a href=\"#security\">Security<\u002Fa><a href=\"#contracts\">Contracts<\u002Fa><a href=\"#status\">Status<\u002Fa>\n<\u002Fnav>\n<div style=\"display:flex;align-items:center;gap:10px\">\n<span class=\"pill hidesm\"><span class=\"blink\"><\u002Fspan>Testnet 46630<\u002Fspan>\n<button class=\"btn btn-p\" type=\"button\" style=\"height:40px;padding:0 18px;font-size:14px\">Connect wallet<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" class=\"wrap\" style=\"padding:84px 32px 40px;display:flex;flex-wrap:wrap;align-items:center;gap:48px\">\n<div style=\"flex:1 1 520px;min-width:0\">\n<div class=\"hl d1\" style=\"display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03)\">\n<span class=\"blink\"><\u002Fspan><span class=\"mono\" style=\"font- px;color:var(--mu)\">deposit_limit() = 0 during the research phase.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"flex:1 1 230px\">\n<svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 56 56\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"28\" cy=\"28\" r=\"22\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"5\"><\u002Fcircle><circle class=\"donut\" cx=\"28\" cy=\"28\" r=\"22\" stroke=\"#52b896\" stroke-width=\"5\" stroke-linecap=\"round\" transform=\"rotate(-90 28 28)\"><\u002Fcircle><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:16px;font-size:12px;color:var(--mu)\">PERFORMANCE FEE<\u002Fdiv><div style=\"margin-top:10px;font-size:36px;font-weight:600;letter-spacing:-.02em\">10.00<span style=\"font-size:17px;color:var(--mu);font-weight:400\">%<\u002Fspan><\u002Fdiv><div style=\"margin-top:8px;font-size:13px;color:var(--mu)\">0% management. Read from the accountant.<\u002Fdiv><\u002Fdiv>\n<div class=\"card\" style=\"flex:1 1 230px\">\n<svg width=\"120\" height=\"56\" sc-camel-view-box=\"0 0 120 56\" fill=\"none\" aria-hidden=\"true\"><line x1=\"10\" y1=\"30\" x2=\"110\" y2=\"30\" stroke=\"rgba(255,255,255,.2)\" stroke-width=\"2\"><\u002Fline><g stroke=\"rgba(255,255,255,.35)\"><line x1=\"10\" y1=\"24\" x2=\"10\" y2=\"36\"><\u002Fline><line x1=\"40\" y1=\"24\" x2=\"40\" y2=\"36\"><\u002Fline><line x1=\"80\" y1=\"24\" x2=\"80\" y2=\"36\"><\u002Fline><line x1=\"110\" y1=\"24\" x2=\"110\" y2=\"36\"><\u002Fline><\u002Fg><g class=\"thumb\"><circle cx=\"10\" cy=\"30\" r=\"7\" fill=\"#52b896\"><\u002Fcircle><\u002Fg><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:16px;font-size:12px;color:var(--mu)\">WITHDRAWALS<\u002Fdiv><div style=\"margin-top:10px;font-size:36px;font-weight:600;letter-spacing:-.02em\">max_loss<\u002Fdiv><div style=\"margin-top:8px;font-size:13px;color:var(--mu)\">Explicit on every exit. No hidden default.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- MARQUEE -->\n<section aria-label=\"Protocol facts\" style=\"border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;overflow:hidden\">\n<div class=\"mq mono\" style=\"font-size:13px;color:var(--mu);white-space:nowrap\">\n<span>◆ ERC-4626 shares<\u002Fspan><span>◆ Yearn V3 API 3.1.1<\u002Fspan><span>◆ chain id 46630<\u002Fspan><span>◆ 6-decimal integer math<\u002Fspan><span>◆ every number carries its block<\u002Fspan><span>◆ 48h admin timelock<\u002Fspan><span>◆ 6h emergency lane<\u002Fspan><span>◆ no audit badge, none claimed<\u002Fspan>\n<span>◆ ERC-4626 shares<\u002Fspan><span>◆ Yearn V3 API 3.1.1<\u002Fspan><span>◆ chain id 46630<\u002Fspan><span>◆ 6-decimal integer math<\u002Fspan><span>◆ every number carries its block<\u002Fspan><span>◆ 48h admin timelock<\u002Fspan><span>◆ 6h emergency lane<\u002Fspan><span>◆ no audit badge, none claimed<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- VAULTS / MANDATES -->\n<section id=\"vaults\" class=\"wrap\" style=\"padding:120px 32px 40px\">\n<div class=\"rv\"><span class=\"eyebrow\">Mandates<\u002Fspan>\n<h2 style=\"margin:16px 0 0;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:760px\">One vault open for research. Five more on the roadmap.<\u002Fh2>\n<p style=\"margin:20px 0 0;max-width:620px;font-size:17px;line-height:1.65;color:var(--mu);font-weight:300\">Each vault runs a single mandate under explicit limits. Mandates without a contract are labelled as roadmap and carry no balance, no rate and no deposit button.<\u002Fp><\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:56px;display:flex;flex-wrap:wrap;gap:16px\">\n<div class=\"card\" style=\"flex:2 1 560px;min-height:380px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#13201a,#0f1612 60%)\">\n<div>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\"><span class=\"pill ok\"><span class=\"blink\"><\u002Fspan>TESTNET · RESEARCH<\u002Fspan><span class=\"pill\">USDG<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:22px 0 0;font-size:36px;letter-spacing:-.02em;font-weight:600\">USDG Managed Yield<\u002Fh3>\n<p style=\"margin:14px 0 0;max-width:520px;font-size:16px;line-height:1.65;color:var(--mu);font-weight:300\">Routes USDG through a Yearn V3 allocator vault into lending venues behind a liquidity buffer. The strategy holds nothing yet, so no venue is named: an unfunded target is not a position.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"margin-top:28px;display:flex;flex-wrap:wrap;gap:28px\" class=\"mono\">\n<div><div style=\"font-size:11px;color:var(--mu)\">VAULT<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:var(--ac)\">0xDa4D…7DA0<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:11px;color:var(--mu)\">ROLE MANAGER<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:var(--am)\">handover in progress<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:11px;color:var(--mu)\">STRATEGIES<\u002Fdiv><div style=\"margin-top:6px;font-size:14px\">1 (mock venue)<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:28px;display:flex;flex-wrap:wrap;gap:12px\"><a class=\"btn btn-p\" href=\"#contracts\" style=\"height:44px\">Open vault<\u002Fa><a class=\"btn btn-g\" href=\"#security\" style=\"height:44px\">Risk bounds<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:16px\">\n<div class=\"card\" style=\"flex:1\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:22px;font-weight:600\">Treasury Reserve<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Short-dated treasury exposure. Needs a real issuer, custody and redemption path first.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"flex:1\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:22px;font-weight:600\">ETH Basis Yield<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Spot ETH against a short derivative. Neutral exposure is a target, not a guarantee.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rv\" style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:16px\">\n<div class=\"card\" style=\"flex:1 1 260px\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:20px;font-weight:600\">Cross-Venue Relative Value<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Price gaps between venues, after execution cost.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"flex:1 1 260px\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:20px;font-weight:600\">Macro / Rate Divergence<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Rate and currency spreads on instruments that are actually reachable.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"flex:1 1 260px\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:20px;font-weight:600\">Custom Mandates<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Depositor or treasury specific policy, caps and exit rules.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW IT WORKS (light band) -->\n<section id=\"how\" class=\"light\" style=\"margin-top:120px;padding:120px 0\">\n<div class=\"wrap\">\n<div class=\"rv\"><span class=\"eyebrow\" style=\"color:#0f7a52\">How it works<\u002Fspan>\n<h2 style=\"margin:16px 0 0;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:720px;color:#0b1a13\">No black boxes. Follow the money, block by block.<\u002Fh2><\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:56px;border-radius:20px;background:#0f1612;padding:36px 28px;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 1100 170\" role=\"img\" aria-label=\"Fund flow from wallet to vault to strategy to venue\" style=\"width:100%;height:auto;display:block\">\n<g fill=\"#131c17\" stroke=\"rgba(255,255,255,.14)\">\n<rect x=\"10\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\"><\u002Frect><rect x=\"300\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\" stroke=\"#52b896\"><\u002Frect><rect x=\"600\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\"><\u002Frect><rect x=\"900\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\"><\u002Frect>\n<\u002Fg>\n<g stroke=\"#52b896\" stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M200 85H300\"><\u002Fpath><path class=\"flow\" d=\"M490 85H600\"><\u002Fpath><path class=\"flow\" d=\"M790 85H900\"><\u002Fpath><\u002Fg>\n<g font-family=\"Sora,sans-serif\" font-size=\"17\" font-weight=\"600\" fill=\"#e9efeb\" text-anchor=\"middle\">\n<text x=\"105\" y=\"92\">Your wallet<\u002Ftext><text x=\"395\" y=\"92\">Allocator vault<\u002Ftext><text x=\"695\" y=\"92\">Strategy<\u002Ftext><text x=\"995\" y=\"92\">Lending venue<\u002Ftext>\n<\u002Fg>\n<g font-family=\"JetBrains Mono,monospace\" font-size=\"12\" fill=\"#8fa198\" text-anchor=\"middle\">\n<text x=\"250\" y=\"68\">deposit<\u002Ftext><text x=\"545\" y=\"68\">update_debt<\u002Ftext><text x=\"845\" y=\"68\">supply<\u002Ftext>\n<text x=\"395\" y=\"150\">ERC-4626 shares<\u002Ftext><text x=\"695\" y=\"150\">default queue<\u002Ftext><text x=\"105\" y=\"150\">USDG<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:40px;display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 300px;padding:32px;border-radius:16px;background:#fff;border:1px solid rgba(11,26,19,.1)\">\n<svg sc-camel-view-box=\"0 0 200 60\" width=\"200\" height=\"60\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"24\" cy=\"30\" r=\"14\" stroke=\"#0b1a13\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"176\" cy=\"30\" r=\"14\" stroke=\"#0f7a52\" stroke-width=\"1.6\"><\u002Fcircle><line x1=\"40\" y1=\"30\" x2=\"160\" y2=\"30\" stroke=\"rgba(11,26,19,.2)\" stroke-dasharray=\"3 5\"><\u002Fline><g class=\"tv\"><circle cx=\"44\" cy=\"30\" r=\"4.5\" fill=\"#0f7a52\"><\u002Fcircle><\u002Fg><text x=\"176\" y=\"34\" text-anchor=\"middle\" font-family=\"JetBrains Mono,monospace\" font-size=\"9\" fill=\"#0f7a52\">46630<\u002Ftext><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:18px;color:#0f7a52;font-size:13px\">01<\u002Fdiv><h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#0b1a13\">Connect<\u002Fh3><p class=\"mu\" style=\"margin:12px 0 0;font-size:15px;line-height:1.65\">The app reads the chain id from the node, asks your wallet to switch to that chain and no other, and refuses to sign anywhere else.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px;padding:32px;border-radius:16px;background:#fff;border:1px solid rgba(11,26,19,.1)\">\n<svg sc-camel-view-box=\"0 0 200 60\" width=\"200\" height=\"60\" fill=\"none\" aria-hidden=\"true\"><rect x=\"124\" y=\"12\" width=\"56\" height=\"38\" rx=\"8\" stroke=\"#0b1a13\" stroke-width=\"1.6\"><\u002Frect><g fill=\"#0f7a52\"><g class=\"coin\"><circle cx=\"30\" cy=\"30\" r=\"6\"><\u002Fcircle><\u002Fg><g class=\"coin c2\"><circle cx=\"30\" cy=\"30\" r=\"6\"><\u002Fcircle><\u002Fg><g class=\"coin c3\"><circle cx=\"30\" cy=\"30\" r=\"6\"><\u002Fcircle><\u002Fg><\u002Fg><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:18px;color:#0f7a52;font-size:13px\">02<\u002Fdiv><h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#0b1a13\">Allocate<\u002Fh3><p class=\"mu\" style=\"margin:12px 0 0;font-size:15px;line-height:1.65\">Deposit against a cap the contract enforces. Shares mint at the price per share read in the same block, with an exact allowance and a minimum-shares guard.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px;padding:32px;border-radius:16px;background:#fff;border:1px solid rgba(11,26,19,.1)\">\n<svg sc-camel-view-box=\"0 0 200 60\" width=\"200\" height=\"60\" fill=\"none\" aria-hidden=\"true\"><rect x=\"0\" y=\"10\" width=\"200\" height=\"12\" rx=\"6\" fill=\"rgba(11,26,19,.1)\"><\u002Frect><rect x=\"0\" y=\"10\" width=\"200\" height=\"12\" rx=\"6\" fill=\"#0b1a13\"><\u002Frect><rect x=\"0\" y=\"38\" width=\"200\" height=\"12\" rx=\"6\" fill=\"rgba(11,26,19,.1)\"><\u002Frect><rect class=\"gauge\" x=\"0\" y=\"38\" width=\"200\" height=\"12\" rx=\"6\" fill=\"#0f7a52\"><\u002Frect><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:18px;color:#0f7a52;font-size:13px\">03<\u002Fdiv><h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#0b1a13\">Monitor and redeem<\u002Fh3><p class=\"mu\" style=\"margin:12px 0 0;font-size:15px;line-height:1.65\">Position value and the amount withdrawable now are two separate figures. Every withdrawal carries an explicit loss budget.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SECURITY -->\n<section id=\"security\" class=\"wrap\" style=\"padding:130px 32px 40px\">\n<div class=\"rv\" style=\"display:flex;flex-wrap:wrap;gap:56px;align-items:center\">\n<div style=\"flex:1 1 440px;min-width:0\">\n<span class=\"eyebrow\">Security before yield<\u002Fspan>\n<h2 style=\"margin:16px 0 0;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-weight:600\">Slow where it matters. Fast where it protects.<\u002Fh2>\n<p style=\"margin:20px 0 0;font-size:17px;line-height:1.65;color:var(--mu);font-weight:300\">Parameter changes queue behind a 48-hour timelock. The guardian gets an emergency lane that can reduce risk but cannot move funds. There is no audit badge here: the Yearn V3 core carries a 2023 audit, the adapters and configuration are not audited.<\u002Fp>\n<div class=\"card\" style=\"margin-top:36px;padding:24px 24px 20px\">\n<svg sc-camel-view-box=\"0 0 540 214\" role=\"img\" aria-label=\"Two timelock lanes: an admin change waits 48 hours in eight six-hour steps before it can execute, an emergency de-risk action waits 6 hours and cannot move funds\" style=\"width:100%;height:auto;display:block\" fill=\"none\">\n<text x=\"0\" y=\"14\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" letter-spacing=\"1.5\" fill=\"#8fa198\">TIMELOCK LANES<\u002Ftext>\n<text x=\"0\" y=\"48\" font-family=\"Sora,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#e9efeb\">Admin changes · 48h<\u002Ftext>\n<text class=\"sch\" x=\"520\" y=\"48\" text-anchor=\"end\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" fill=\"#d9a94a\">scheduled, waiting<\u002Ftext>\n<text class=\"ex\" x=\"520\" y=\"48\" text-anchor=\"end\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" fill=\"#52b896\">executable<\u002Ftext>\n<rect x=\"0\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"66\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"132\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"198\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"264\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"330\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"396\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"462\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:0.35s\" x=\"0\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:1.35s\" x=\"66\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:2.35s\" x=\"132\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:3.35s\" x=\"198\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:4.35s\" x=\"264\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:5.35s\" x=\"330\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:6.35s\" x=\"396\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect><rect class=\"seg\" style=\"animation-delay:7.35s\" x=\"462\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#52b896\"><\u002Frect>\n<g class=\"pk\"><rect x=\"0\" y=\"59\" width=\"28\" height=\"28\" rx=\"7\" fill=\"#0a0f0d\" stroke=\"#e9efeb\" stroke-width=\"1.5\"><\u002Frect><text x=\"14\" y=\"77\" text-anchor=\"middle\" font-family=\"JetBrains Mono,monospace\" font-size=\"10\" fill=\"#e9efeb\">tx<\u002Ftext><\u002Fg>\n<g font-family=\"JetBrains Mono,monospace\" font-size=\"10\" fill=\"#8fa198\"><text x=\"0\" y=\"104\">0h<\u002Ftext><text x=\"132\" y=\"104\" text-anchor=\"middle\">12h<\u002Ftext><text x=\"264\" y=\"104\" text-anchor=\"middle\">24h<\u002Ftext><text x=\"396\" y=\"104\" text-anchor=\"middle\">36h<\u002Ftext><text x=\"520\" y=\"104\" text-anchor=\"end\">48h<\u002Ftext><\u002Fg>\n<line x1=\"0\" y1=\"122\" x2=\"540\" y2=\"122\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n<text x=\"0\" y=\"150\" font-family=\"Sora,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#e9efeb\">Emergency lane · 6h<\u002Ftext>\n<text x=\"520\" y=\"150\" text-anchor=\"end\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" fill=\"#7f9fd8\">reduce risk only<\u002Ftext>\n<rect x=\"0\" y=\"162\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect>\n<rect class=\"seg\" style=\"animation-delay:.15s\" x=\"0\" y=\"162\" width=\"58\" height=\"18\" rx=\"4\" fill=\"#7f9fd8\"><\u002Frect>\n<line x1=\"66\" y1=\"171\" x2=\"520\" y2=\"171\" stroke=\"rgba(255,255,255,.2)\" stroke-dasharray=\"3 6\"><\u002Fline>\n<g class=\"pk2\"><rect x=\"0\" y=\"157\" width=\"28\" height=\"28\" rx=\"7\" fill=\"#0a0f0d\" stroke=\"#7f9fd8\" stroke-width=\"1.5\"><\u002Frect><text x=\"14\" y=\"175\" text-anchor=\"middle\" font-family=\"JetBrains Mono,monospace\" font-size=\"10\" fill=\"#7f9fd8\">tx<\u002Ftext><\u002Fg>\n<g transform=\"translate(236 191)\" stroke=\"#8fa198\" stroke-width=\"1.4\"><rect x=\"0\" y=\"5\" width=\"12\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M3 5V3a3 3 0 0 1 6 0v2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fg>\n<text x=\"256\" y=\"200\" font-family=\"JetBrains Mono,monospace\" font-size=\"10\" fill=\"#8fa198\">cannot move funds, cannot propose<\u002Ftext>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px\">\n<div class=\"card\"><div class=\"mono\" style=\"color:var(--ac);font-size:12px\">01<\u002Fdiv><h3 style=\"margin:14px 0 0;font-size:19px;font-weight:600\">Dual-speed timelock<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Role handoffs, fee updates and new strategies wait 48 hours in public view.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"mono\" style=\"color:var(--ac);font-size:12px\">02<\u002Fdiv><h3 style=\"margin:14px 0 0;font-size:19px;font-weight:600\">Explicit loss budget<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">max_loss is chosen by you on every exit. The app never defaults it.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"mono\" style=\"color:var(--ac);font-size:12px\">03<\u002Fdiv><h3 style=\"margin:14px 0 0;font-size:19px;font-weight:600\">Untouched core<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Pinned Yearn V3 bytecode. Only the adapter and hook are ours.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><div class=\"mono\" style=\"color:var(--ac);font-size:12px\">04<\u002Fdiv><h3 style=\"margin:14px 0 0;font-size:19px;font-weight:600\">Integer provenance<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;col ize:54px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:760px\">One vault open for research. Five more on the roadmap.<\u002Fh2>\n<p style=\"margin:20px 0 0;max-width:620px;font-size:17px;line-height:1.65;color:var(--mu);font-weight:300\">Each vault runs a single mandate under explicit limits. Mandates without a contract are labelled as roadmap and carry no balance, no rate and no deposit button.<\u002Fp><\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:56px;display:flex;flex-wrap:wrap;gap:16px\">\n<div class=\"card\" style=\"flex:2 1 560px;min-height:380px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#13201a,#0f1612 60%)\">\n<div>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\"><span class=\"pill ok\"><span class=\"blink\"><\u002Fspan>TESTNET · RESEARCH<\u002Fspan><span class=\"pill\">USDG<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin:22px 0 0;font-size:36px;letter-spacing:-.02em;font-weight:600\">USDG Managed Yield<\u002Fh3>\n<p style=\"margin:14px 0 0;max-width:520px;font-size:16px;line-height:1.65;color:var(--mu);font-weight:300\">Routes USDG through a Yearn V3 allocator vault into lending venues behind a liquidity buffer. The strategy holds nothing yet, so no venue is named: an unfunded target is not a position.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"margin-top:28px;display:flex;flex-wrap:wrap;gap:28px\" class=\"mono\">\n<div><div style=\"font-size:11px;color:var(--mu)\">VAULT<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:var(--ac)\">0xDa4D…7DA0<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:11px;color:var(--mu)\">ROLE MANAGER<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:var(--am)\">handover in progress<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:11px;color:var(--mu)\">STRATEGIES<\u002Fdiv><div style=\"margin-top:6px;font-size:14px\">1 (mock venue)<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:28px;display:flex;flex-wrap:wrap;gap:12px\"><a class=\"btn btn-p\" href=\"#contracts\" style=\"height:44px\">Open vault<\u002Fa><a class=\"btn btn-g\" href=\"#security\" style=\"height:44px\">Risk bounds<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:16px\">\n<div class=\"card\" style=\"flex:1\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:22px;font-weight:600\">Treasury Reserve<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Short-dated treasury exposure. Needs a real issuer, custody and redemption path first.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"flex:1\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:22px;font-weight:600\">ETH Basis Yield<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Spot ETH against a short derivative. Neutral exposure is a target, not a guarantee.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"rv\" style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:16px\">\n<div class=\"card\" style=\"flex:1 1 260px\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:20px;font-weight:600\">Cross-Venue Relative Value<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Price gaps between venues, after execution cost.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"flex:1 1 260px\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:20px;font-weight:600\">Macro / Rate Divergence<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Rate and currency spreads on instruments that are actually reachable.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"flex:1 1 260px\"><span class=\"pill\">ROADMAP<\u002Fspan><h3 style=\"margin:16px 0 0;font-size:20px;font-weight:600\">Custom Mandates<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mu);font-weight:300\">Depositor or treasury specific policy, caps and exit rules.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"how\" class=\"light\" style=\"margin-top:120px;padding:120px 0\">\n<div class=\"wrap\">\n<div class=\"rv\"><span class=\"eyebrow\" style=\"color:#0f7a52\">How it works<\u002Fspan>\n<h2 style=\"margin:16px 0 0;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-weight:600;max-width:720px;color:#0b1a13\">No black boxes. Follow the money, block by block.<\u002Fh2><\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:56px;border-radius:20px;background:#0f1612;padding:36px 28px;overflow:hidden\">\n<svg viewBox=\"0 0 1100 170\" role=\"img\" aria-label=\"Fund flow from wallet to vault to strategy to venue\" style=\"width:100%;height:auto;display:block\">\n<g fill=\"#131c17\" stroke=\"rgba(255,255,255,.14)\">\n<rect x=\"10\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\"><\u002Frect><rect x=\"300\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\" stroke=\"#52b896\"><\u002Frect><rect x=\"600\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\"><\u002Frect><rect x=\"900\" y=\"45\" width=\"190\" height=\"80\" rx=\"14\"><\u002Frect>\n<\u002Fg>\n<g stroke=\"#52b896\" stroke-width=\"2\" fill=\"none\"><path class=\"flow\" d=\"M200 85H300\"><\u002Fpath><path class=\"flow\" d=\"M490 85H600\"><\u002Fpath><path class=\"flow\" d=\"M790 85H900\"><\u002Fpath><\u002Fg>\n<g font-family=\"Sora,sans-serif\" font-size=\"17\" font-weight=\"600\" fill=\"#e9efeb\" text-anchor=\"middle\">\n<text x=\"105\" y=\"92\">Your wallet<\u002Ftext><text x=\"395\" y=\"92\">Allocator vault<\u002Ftext><text x=\"695\" y=\"92\">Strategy<\u002Ftext><text x=\"995\" y=\"92\">Lending venue<\u002Ftext>\n<\u002Fg>\n<g font-family=\"JetBrains Mono,monospace\" font-size=\"12\" fill=\"#8fa198\" text-anchor=\"middle\">\n<text x=\"250\" y=\"68\">deposit<\u002Ftext><text x=\"545\" y=\"68\">update_debt<\u002Ftext><text x=\"845\" y=\"68\">supply<\u002Ftext>\n<text x=\"395\" y=\"150\">ERC-4626 shares<\u002Ftext><text x=\"695\" y=\"150\">default queue<\u002Ftext><text x=\"105\" y=\"150\">USDG<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n\n<div class=\"rv\" style=\"margin-top:40px;display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 300px;padding:32px;border-radius:16px;background:#fff;border:1px solid rgba(11,26,19,.1)\">\n<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"24\" cy=\"30\" r=\"14\" stroke=\"#0b1a13\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"176\" cy=\"30\" r=\"14\" stroke=\"#0f7a52\" stroke-width=\"1.6\"><\u002Fcircle><line x1=\"40\" y1=\"30\" x2=\"160\" y2=\"30\" stroke=\"rgba(11,26,19,.2)\" stroke-dasharray=\"3 5\"><\u002Fline><g class=\"tv\"><circle cx=\"44\" cy=\"30\" r=\"4.5\" fill=\"#0f7a52\"><\u002Fcircle><\u002Fg><text x=\"176\" y=\"34\" text-anchor=\"middle\" font-family=\"JetBrains Mono,monospace\" font-size=\"9\" fill=\"#0f7a52\">46630<\u002Ftext><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:18px;color:#0f7a52;font-size:13px\">01<\u002Fdiv><h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#0b1a13\">Connect<\u002Fh3><p class=\"mu\" style=\"margin:12px 0 0;font-size:15px;line-height:1.65\">The app reads the chain id from the node, asks your wallet to switch to that chain and no other, and refuses to sign anywhere else.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px;padding:32px;border-radius:16px;background:#fff;border:1px solid rgba(11,26,19,.1)\">\n<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" fill=\"none\" aria-hidden=\"true\"><rect x=\"124\" y=\"12\" width=\"56\" height=\"38\" rx=\"8\" stroke=\"#0b1a13\" stroke-width=\"1.6\"><\u002Frect><g fill=\"#0f7a52\"><g class=\"coin\"><circle cx=\"30\" cy=\"30\" r=\"6\"><\u002Fcircle><\u002Fg><g class=\"coin c2\"><circle cx=\"30\" cy=\"30\" r=\"6\"><\u002Fcircle><\u002Fg><g class=\"coin c3\"><circle cx=\"30\" cy=\"30\" r=\"6\"><\u002Fcircle><\u002Fg><\u002Fg><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:18px;color:#0f7a52;font-size:13px\">02<\u002Fdiv><h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#0b1a13\">Allocate<\u002Fh3><p class=\"mu\" style=\"margin:12px 0 0;font-size:15px;line-height:1.65\">Deposit against a cap the contract enforces. Shares mint at the price per share read in the same block, with an exact allowance and a minimum-shares guard.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px;padding:32px;border-radius:16px;background:#fff;border:1px solid rgba(11,26,19,.1)\">\n<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" fill=\"none\" aria-hidden=\"true\"><rect x=\"0\" y=\"10\" width=\"200\" height=\"12\" rx=\"6\" fill=\"rgba(11,26,19,.1)\"><\u002Frect><rect x=\"0\" y=\"10\" width=\"200\" height=\"12\" rx=\"6\" fill=\"#0b1a13\"><\u002Frect><rect x=\"0\" y=\"38\" width=\"200\" height=\"12\" rx=\"6\" fill=\"rgba(11,26,19,.1)\"><\u002Frect><rect class=\"gauge\" x=\"0\" y=\"38\" width=\"200\" height=\"12\" rx=\"6\" fill=\"#0f7a52\"><\u002Frect><\u002Fsvg>\n<div class=\"mono\" style=\"margin-top:18px;color:#0f7a52;font-size:13px\">03<\u002Fdiv><h3 style=\"margin:10px 0 0;font-size:24px;font-weight:600;color:#0b1a13\">Monitor and redeem<\u002Fh3><p class=\"mu\" style=\"margin:12px 0 0;font-size:15px;line-height:1.65\">Position value and the amount withdrawable now are two separate figures. Every withdrawal carries an explicit loss budget.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"security\" class=\"wrap\" style=\"padding:130px 32px 40px\">\n<div class=\"rv\" style=\"display:flex;flex-wrap:wrap;gap:56px;align-items:center\">\n<div style=\"flex:1 1 440px;min-width:0\">\n<span class=\"eyebrow\">Security before yield<\u002Fspan>\n<h2 style=\"margin:16px 0 0;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-weight:600\">Slow where it matters. Fast where it protects.<\u002Fh2>\n<p style=\"margin:20px 0 0;font-size:17px;line-height:1.65;color:var(--mu);font-weight:300\">Parameter changes queue behind a 48-hour timelock. The guardian gets an emergency lane that can reduce risk but cannot move funds. There is no audit badge here: the Yearn V3 core carries a 2023 audit, the adapters and configuration are not audited.<\u002Fp>\n<div class=\"card\" style=\"margin-top:36px;padding:24px 24px 20px\">\n<svg viewBox=\"0 0 540 214\" role=\"img\" aria-label=\"Two timelock lanes: an admin change waits 48 hours in eight six-hour steps before it can execute, an emergency de-risk action waits 6 hours and cannot move funds\" style=\"width:100%;height:auto;display:block\" fill=\"none\">\n<text x=\"0\" y=\"14\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" letter-spacing=\"1.5\" fill=\"#8fa198\">TIMELOCK LANES<\u002Ftext>\n<text x=\"0\" y=\"48\" font-family=\"Sora,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#e9efeb\">Admin changes · 48h<\u002Ftext>\n<text class=\"sch\" x=\"520\" y=\"48\" text-anchor=\"end\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" fill=\"#d9a94a\">scheduled, waiting<\u002Ftext>\n<text class=\"ex\" x=\"520\" y=\"48\" text-anchor=\"end\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" fill=\"#52b896\">executable<\u002Ftext>\n<rect x=\"0\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"66\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"132\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"198\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"264\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"330\" y=\"64\" width=\"58\" height=\"18\" rx=\"4\" fill=\"rgba(255,255,255,.07)\"><\u002Frect><rect x=\"396\" y=\"64\" width=\"58\" height=\"
